<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <div class="logo">
            <img src="./images/odin-lined.png" alt="Logo">
            <h1>Odin Forms</h1>
        </div>
    </div>
    <div class="content">
        <div class="text">
            <strong> 
                This not a real online service! You know you need something like this in your life to help you realize
                your deepest dreams. Sign up now to get started.
                <br><br>
                You know you want to.
            </strong>
        </div>
        <div class="form">
            <form action="">
                <div class="form-group">
                    <h2>Let's Get Started!</h2>
                    <label for="f_name">First Name:</label>
                    <input type="text" id="f_name" name="f_name"><br><br>
                    <label for="l_name">Last Name:</label>
                    <input type="text" id="l_name" name="l_name"><br><br>
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email"><br><br>
                    <label for="fone">Phone Number:</label>
                    <input type="tel" id="fone" name="fone"><br><br>
                    <label for="password">Password:</label>
                    <input type="password" id="password" name="password"><br><br>
                    <label for="confirm_password">Confirm Password:</label>
                    <input type="password" id="confirm_password" name="confirm_password"><br><br>
                </div>
                <div class="submit-button">
                    <button type="submit">Create Account</button>
                </div>
            </form>
        </div>
    </div>
</body>

</html>
