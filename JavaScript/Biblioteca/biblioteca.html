<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblioteca Pessoal</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        Biblioteca Pessoal
    </header>
    <div class="biblioteca">
        <div class="estante" id="estante">

        </div>
    </div>
    <div class="bot">
        <div class="comandos">
            <button id="novoLivro" name="novoLivro">Novo Livro</button>
        </div>
        <footer>@Murilo M. Ferreira</footer>
    </div>

    <dialog id="book-dialog">
        <form class="form-dialog" id="form-dialog" method="dialog">
            <h2>Informações do Livro</h2>

            <label for="nome">Nome:</label>
            <input type="text" id="nome" required name="nome">
            <label for="nome">Autor:</label>
            <input type="text" id="autor" required name="autor">
            <label for="nome">Paginas:</label>
            <input type="number" id="pages" name="pages" min="0">
            <label for="lido">
                <input type="checkbox" name="lido" id="lido">
                Já li este livro
            </label><br>
            <div class="action">
                <button class="btn btn-ghost" id="cancel" type="button">Cancelar</button>
                <button class="btn btn-primary" type="submit">Enviar</button>
            </div>
        </form>
    </dialog>

    <script src="script.js"></script>
</body>

</html>
