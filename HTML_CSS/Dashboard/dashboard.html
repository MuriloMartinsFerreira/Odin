<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>
    <div class="container">
        <div class="sidebar">
            <h1>Dashboard</h1>
            <ul>
                <li><a href="#"><i class="fa-solid fa-house"></i> Home</a></li>
                <li><a href="#"><i class="fa-solid fa-id-card"></i> Profile</a></li>
                <li><a href="#"><i class="fa-solid fa-message"></i> Messages</a></li>
                <li><a href="#"><i class="fa-solid fa-clock"></i> History</a></li>
                <li><a href="#"><i class="fa-solid fa-file"></i> Tasks</a></li>
                <li><a href="#"><i class="fa-solid fa-users"></i> Communities</a></li>
            </ul>
            <ul>
                <li><a href="#"><i class="fa-solid fa-gear"></i> Settings</a></li>
                <li><a href="#"><i class="fa-solid fa-circle-question"></i> Support</a></li>
                <li><a href="#"><i class="fa-solid fa-shield"></i> Privacy</a></li>
            </ul>
        </div>
        <div class="nav">
            <div class="buscador">
                <label for="busca"><i class="fa-solid fa-magnifying-glass"></i></label>
                <input type="text" id="busca" name="busca">
            </div>
            <div class="noti">
                <button>
                    <i class="fa-solid fa-bell"></i>
                </button>
                <img src="./images/usuario.jpg" alt="img">
                <p><strong>Morgan Oakley</strong></p>
            </div>
            <div class="perfil">
                <img src="./images/usuario.jpg" alt="img">
                <div>
                    <p>Hi there</p>
                    <h2>Morgan Oakley (@morgan)</h2>
                </div>
            </div>
            <div class="menu">
                <button>New</button>
                <button>Upload</button>
                <button>Share</button>
            </div>
        </div>
        <div class="artigos">

            <div class="projects">
                <h3>Your Projects</h3>

                <div class="cards">
                    <div class="card">Projeto 1</div>
                    <div class="card">Projeto 2</div>
                    <div class="card">Projeto 3</div>
                    <div class="card">Projeto 4</div>
                    <div class="card">Projeto 5</div>
                    <div class="card">Projeto 6</div>
                </div>
            </div>

            <div class="sidebar2">

                <div class="announcements">
                    <h2>Announcements</h2>
                    <div class="box">Conteúdo</div>
                </div>

                <div class="trending">
                    <h2>Trending</h2>
                    <div class="box">Conteúdo</div>
                </div>

            </div>

        </div>
    </div>
</body>

</html>
