<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sua Biblioteca | Gerenciador Pessoal</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <header class="main-header">
    <h1>Biblioteca Pessoal</h1>
  </header>

  <main class="container">
    <section class="estante" id="estante">
    </section>
  </main>

  <nav class="action-bar">
    <button id="novoLivro" class="btn-add" aria-label="Adicionar novo livro">
      <span>+</span> Novo Livro
    </button>
    <footer class="main-footer">© Murilo M. Ferreira</footer>
  </nav>

  <dialog id="book-dialog">
    <form id="form-dialog" method="dialog">
      <h2>Novo Livro</h2>

      <div class="input-group">
        <label for="nome">Título</label>
        <input type="text" id="nome" name="nome" required placeholder="Ex: O Hobbit">
      </div>

      <div class="input-group">
        <label for="autor">Autor</label>
        <input type="text" id="autor" name="autor" required placeholder="Ex: J.R.R. Tolkien">
      </div>

      <div class="input-group">
        <label for="pages">Páginas</label>
        <input type="number" id="pages" name="pages" min="1" required placeholder="0">
      </div>

      <div class="checkbox-group">
        <input type="checkbox" name="lido" id="lido">
        <label for="lido">Já concluí a leitura</label>
      </div>

      <div class="form-actions">
        <button class="btn btn-secondary" id="cancel" type="button">Cancelar</button>
        <button class="btn btn-primary" type="submit">Adicionar à Estante</button>
      </div>
    </form>
  </dialog>

  <script src="script.js"></script>
</body>

</html>
